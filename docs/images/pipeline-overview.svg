<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gate-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="review-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700" letter-spacing="0.5">Automated AI Code Review Pipeline</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b949e" font-size="12">(Any Provider, Any Model)</text>
  <text x="480" y="78" text-anchor="middle" fill="#8b949e" font-size="13">PR  →  Chunk  →  AI Analysis  →  Structured Review  →  PR</text>

  <!-- ========== MAIN FLOW ========== -->

  <!-- Step 1: Pull Request -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="150" height="100" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <rect x="40" y="100" width="150" height="100" rx="10" fill="url(#glow-blue)"/>
    <!-- PR icon -->
    <g transform="translate(82, 118)">
      <circle cx="10" cy="6" r="5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="10" cy="30" r="5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="30" cy="18" r="5" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <line x1="10" y1="11" x2="10" y2="25" stroke="#58a6ff" stroke-width="2"/>
      <path d="M28 13 Q10 13 10 25" fill="none" stroke="#58a6ff" stroke-width="2"/>
    </g>
    <text x="115" y="170" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Pull Request</text>
    <text x="115" y="186" text-anchor="middle" fill="#8b949e" font-size="11">opened / updated</text>
  </g>

  <!-- Arrow 1→2 -->
  <g>
    <line x1="195" y1="150" x2="245" y2="150" stroke="#30363d" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="245,145 255,150 245,155" fill="#30363d"/>
  </g>

  <!-- Step 2: GitHub Actions Gate -->
  <g filter="url(#shadow)">
    <rect x="260" y="95" width="160" height="110" rx="10" fill="#21262d" stroke="#238636" stroke-width="1.5"/>
    <!-- Gate icon -->
    <g transform="translate(310, 112)">
      <rect x="0" y="0" width="20" height="24" rx="3" fill="none" stroke="#3fb950" stroke-width="2"/>
      <line x1="5" y1="7" x2="15" y2="7" stroke="#3fb950" stroke-width="1.5"/>
      <line x1="5" y1="12" x2="15" y2="12" stroke="#3fb950" stroke-width="1.5"/>
      <line x1="5" y1="17" x2="12" y2="17" stroke="#3fb950" stroke-width="1.5"/>
    </g>
    <text x="340" y="160" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">GitHub Actions</text>
    <text x="340" y="176" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="500">CI Gate</text>
    <text x="340" y="192" text-anchor="middle" fill="#8b949e" font-size="10">diff + chunk</text>
  </g>

  <!-- Arrow 2→3 -->
  <g>
    <line x1="425" y1="150" x2="475" y2="150" stroke="#30363d" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="475,145 485,150 475,155" fill="#30363d"/>
    <text x="455" y="140" text-anchor="middle" fill="#484f58" font-size="9">opencode</text>
  </g>

  <!-- Step 3: AI Models -->
  <g filter="url(#shadow)">
    <rect x="490" y="85" width="180" height="130" rx="10" fill="#21262d" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="490" y="85" width="180" height="130" rx="10" fill="url(#ai-grad)" opacity="0.08"/>
    <!-- Brain/AI icon -->
    <g transform="translate(555, 100)">
      <circle cx="15" cy="12" r="10" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
      <path d="M10 10 Q15 2 20 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M10 14 Q15 22 20 14" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <line x1="15" y1="6" x2="15" y2="18" stroke="#a78bfa" stroke-width="1"/>
    </g>
    <text x="580" y="138" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">AI Models</text>
    <g transform="translate(505, 150)">
      <rect x="0" y="0" width="55" height="18" rx="9" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
      <text x="27" y="13" text-anchor="middle" fill="#79c0ff" font-size="9">Gemini</text>
      <rect x="62" y="0" width="45" height="18" rx="9" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
      <text x="84" y="13" text-anchor="middle" fill="#79c0ff" font-size="9">GPT</text>
      <rect x="114" y="0" width="50" height="18" rx="9" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
      <text x="139" y="13" text-anchor="middle" fill="#79c0ff" font-size="9">Claude</text>
    </g>
    <g transform="translate(518, 172)">
      <rect x="0" y="0" width="75" height="18" rx="9" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
      <text x="37" y="13" text-anchor="middle" fill="#79c0ff" font-size="9">OpenCode GO</text>
      <rect x="82" y="0" width="68" height="18" rx="9" fill="#1a1a2e" stroke="#30363d" stroke-width="1"/>
      <text x="116" y="13" text-anchor="middle" fill="#79c0ff" font-size="9">OpenRouter</text>
    </g>
  </g>

  <!-- Arrow 3→4 -->
  <g>
    <line x1="675" y1="150" x2="725" y2="150" stroke="#30363d" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="725,145 735,150 725,155" fill="#30363d"/>
  </g>

  <!-- Step 4: Consolidated Review -->
  <g filter="url(#shadow)">
    <rect x="740" y="95" width="175" height="110" rx="10" fill="#21262d" stroke="#f0883e" stroke-width="1.5"/>
    <!-- Document/review icon -->
    <g transform="translate(795, 110)">
      <rect x="0" y="0" width="22" height="28" rx="3" fill="none" stroke="#f0883e" stroke-width="1.8"/>
      <line x1="5" y1="8" x2="17" y2="8" stroke="#f0883e" stroke-width="1.2"/>
      <line x1="5" y1="13" x2="17" y2="13" stroke="#f0883e" stroke-width="1.2"/>
      <line x1="5" y1="18" x2="13" y2="18" stroke="#f0883e" stroke-width="1.2"/>
      <!-- Priority dots -->
      <circle cx="7" cy="24" r="2.5" fill="#f85149"/>
      <circle cx="14" cy="24" r="2.5" fill="#f0883e"/>
      <circle cx="21" cy="24" r="2.5" fill="#d29922"/>
    </g>
    <text x="828" y="160" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Review Posted</text>
    <text x="828" y="176" text-anchor="middle" fill="#8b949e" font-size="10">Critical / High /</text>
    <text x="828" y="189" text-anchor="middle" fill="#8b949e" font-size="10">Medium / Low</text>
  </g>

  <!-- ========== THREE SKILLS SECTION ========== -->

  <!-- Section divider -->
  <line x1="60" y1="250" x2="900" y2="250" stroke="#21262d" stroke-width="1"/>
  <text x="480" y="275" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1">THREE SKILLS</text>

  <!-- Skill 1: ai-review-report -->
  <g filter="url(#shadow)">
    <rect x="60" y="295" width="260" height="100" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="60" y="295" width="260" height="4" rx="2" fill="#3fb950"/>
    <circle cx="85" cy="325" r="12" fill="#238636" opacity="0.3"/>
    <text x="85" y="330" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">1</text>
    <text x="108" y="322" fill="#e6edf3" font-size="13" font-weight="600">ai-review-report</text>
    <text x="108" y="339" fill="#8b949e" font-size="11">Generates the review</text>
    <text x="78" y="365" fill="#484f58" font-size="10">CI gate + local script</text>
    <rect x="210" y="355" width="90" height="20" rx="10" fill="#238636" opacity="0.15"/>
    <text x="255" y="369" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="500">/ai-review-report</text>
  </g>

  <!-- Skill 2: ai-review -->
  <g filter="url(#shadow)">
    <rect x="350" y="295" width="260" height="100" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="350" y="295" width="260" height="4" rx="2" fill="#58a6ff"/>
    <circle cx="375" cy="325" r="12" fill="#1f6feb" opacity="0.3"/>
    <text x="375" y="330" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">2</text>
    <text x="398" y="322" fill="#e6edf3" font-size="13" font-weight="600">ai-review</text>
    <text x="398" y="339" fill="#8b949e" font-size="11">Human fix / skip decisions</text>
    <text x="368" y="365" fill="#484f58" font-size="10">Interactive / manual</text>
    <rect x="500" y="355" width="90" height="20" rx="10" fill="#1f6feb" opacity="0.15"/>
    <text x="545" y="369" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="500">/ai-review</text>
  </g>

  <!-- Skill 3: ai-analyse -->
  <g filter="url(#shadow)">
    <rect x="640" y="295" width="260" height="100" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="640" y="295" width="260" height="4" rx="2" fill="#a78bfa"/>
    <circle cx="665" cy="325" r="12" fill="#7c3aed" opacity="0.3"/>
    <text x="665" y="330" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">3</text>
    <text x="688" y="322" fill="#e6edf3" font-size="13" font-weight="600">ai-analyse</text>
    <text x="688" y="339" fill="#8b949e" font-size="11">Autonomous low/med auto-fix</text>
    <text x="658" y="365" fill="#484f58" font-size="10">CI self-fix (no tests touched)</text>
    <rect x="790" y="355" width="90" height="20" rx="10" fill="#7c3aed" opacity="0.15"/>
    <text x="835" y="369" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="500">/ai-analyse</text>
  </g>

  <!-- ========== BOTTOM: Flow cycle arrow ========== -->

  <!-- Feedback loop arrow from review back to PR -->
  <g opacity="0.6">
    <path d="M828 210 L828 235 Q828 245 818 245 L142 245 Q130 245 130 235 L130 210"
          fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="125,215 130,205 135,215" fill="#30363d"/>
    <text x="480" y="240" text-anchor="middle" fill="#484f58" font-size="10" font-style="italic">review feedback loop</text>
  </g>

  <!-- Bottom: provider-agnostic note -->
  <g>
    <rect x="310" y="420" width="340" height="50" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="480" y="442" text-anchor="middle" fill="#8b949e" font-size="11">
      <tspan fill="#a78bfa" font-weight="600">opencode</tspan> — provider-agnostic model transport
    </text>
    <text x="480" y="458" text-anchor="middle" fill="#484f58" font-size="10">Native APIs  ·  LiteLLM proxy  ·  OpenCode Go gateway</text>
  </g>

  <!-- Five consumption channels badge -->
  <g transform="translate(355, 480)">
    <rect x="0" y="0" width="250" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="125" y="16" text-anchor="middle" fill="#8b949e" font-size="10">5 ways to consume: reusable workflow · plugins · npm</text>
  </g>
</svg>
name: OpenCode Review Report

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      model:
        description: 'Primary review model ID (optional). Ignored when "model_preset" is set to anything other than "(repository default)". Blank → OPENCODE_REVIEW_REPORT_MODEL_PRIMARY / provider default. Must be a model of the selected OPENCODE_REVIEW_REPORT_PROVIDER (e.g. gemini-3.1-pro-preview for GEMINI, gpt-5.5 for OPENAI/COPILOT, claude-opus-4-8 for ANTHROPIC, deepseek-v4-pro/grok-4.5/glm-5.2/kimi-k3 for OPENCODE-GO-OPENAI, qwen3.7-plus/qwen3.7-max/minimax-m3 for OPENCODE-GO-ANTHROPIC, deepseek/deepseek-v4-pro for OPEN_ROUTER).'
        required: false
        type: string
        default: ''
      model_preset:
        # One-click preset: picking a model here sets the provider AND all three
        # model tiers (primary/secondary/orchestrator) to that single model, so a
        # reviewer can switch the whole review onto e.g. GPT-5.5 or Qwen3.7 Plus
        # without touching the repo Variables. Resolved in the job env: block below
        # (highest precedence — wins over "model" and the OPENCODE_REVIEW_REPORT_* Variables).
        # Add a new option here AND extend the env: expressions in the same commit.
        description: 'Model preset (optional). Selecting one overrides the provider AND all three model tiers (primary/secondary/orchestrator) with that single model — takes precedence over "model" and the repo OPENCODE_REVIEW_REPORT_* Variables. Leave on "(repository default)" to use the configured Variables.'
        required: false
        type: choice
        default: '(repository default)'
        options:
          - '(repository default)'
          - 'Anthropic Claude Opus 4.8'
          - 'Anthropic Claude Sonnet 4.6'
          - 'Anthropic Claude Haiku 4.5'
          - 'OpenAI GPT-5.5'
          - 'OpenCode DeepSeek V4 Pro'
          - 'OpenCode DeepSeek V4 Flash'
          - 'OpenCode GLM-5.2'
          - 'OpenCode GLM-5.1'
          - 'OpenCode Grok 4.5'
          - 'OpenCode Hy3'
          - 'OpenCode Kimi K3'
          - 'OpenCode Kimi K2.7 Code'
          - 'OpenCode Kimi K2.6'
          - 'OpenCode MiMo V2.5'
          - 'OpenCode MiMo V2.5 Pro'
          - 'OpenCode MiniMax M3'
          - 'OpenCode MiniMax M2.7'
          - 'OpenCode MiniMax M2.5'
          - 'OpenCode Qwen3.7 Max'
          - 'OpenCode Qwen3.7 Plus'
          - 'OpenCode Qwen3.6 Plus'
          - 'OpenRouter DeepSeek V4 Pro'
          - 'OpenRouter Qwen3.7 Plus'
          - 'OpenRouter GLM-5.1'
          - 'OpenRouter MiniMax M3'
      disable_claude_code:
        description: 'Disable Claude Code (.claude) support (1=disabled, 0=enabled). Avoids conflicts between opencode and Claude Code directories. Dispatch always supplies 1 or 0 (the OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE Variable is unreachable on dispatch); the reusable-call input defaults to blank and falls through to the Variable.'
        required: false
        type: choice
        default: '1'
        options:
          - '1'
          - '0'
      disable_agents_md_check:
        description: 'Disable AGENTS.md documentation validation (1=disabled, 0=enabled). Default: 0.'
        required: false
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
      bypass_mandatory_context_file:
        description: 'Bypass AGENTS.md checks and mandatory context file loading (1=bypassed, 0=normal). When truthy, skips both the mandatory context file injection and the AGENTS.md validation gate. Default: 0.'
        required: false
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
      opencode_config:
        description: 'Repo-relative path to a custom opencode.json inside the repo under review (e.g. .github/opencode.json). Blank → the built-in .agents/skills/ai-review-report/assets/opencode.json. Any override MUST keep {env:OPENCODE_*} placeholders for credentials — never commit real keys.'
        required: false
        type: string
        default: ''
  # Reusable-workflow entry point: consuming repos call this workflow with
  #   uses: generic-automation-and-it/smooth-ai-report-review/.github/workflows/pipeline-code-review-report.yml@v1
  # instead of copy-installing it (see .docs/examples/code-review-caller.yml and the
  # README "Use as a reusable workflow" section). Notes:
  # - The job body is a thin wrapper around scripts/run-review.sh — the same
  #   entrypoint that the local-job packaging in .docs/examples/code-review-local.yml
  #   invokes. Two packagings, one implementation: any change to the gate's
  #   behaviour must land in run-review.sh, not in this workflow.
  # - Secrets: the gate reads the canonical OPENCODE_*_API_KEY Secret names and uses
  #   only the selected provider's key. SAME-ORG callers may use `secrets: inherit`;
  #   CROSS-ORG callers must map the keys explicitly under `secrets:` (inherit is
  #   same-org/enterprise only). The workflow_call.secrets block below declares them
  #   so either form works — see .docs/examples/code-review-caller.yml.
  # - GitHub Variables (vars.OPENCODE_REVIEW_REPORT_*) resolve against the CALLER
  #   repo/org, so the existing Variables contract transfers unchanged.
  # - workflow_call does not support `type: choice`; model_preset is a plain string
  #   here and the caller template provides the dropdown. Keep its accepted values
  #   in sync with the workflow_dispatch options list above.
  # - Consumers under allowed_actions: "selected" cannot use the reusable-workflow
  #   call at all (startup_failure). They use the local-job packaging in
  #   .docs/examples/code-review-local.yml instead, which checks out this repo at a
  #   pinned SHA and invokes the same run-review.sh entrypoint. That packaging is
  #   contrary to the spirit of the allow-list policy and requires security sign-off
  #   from the consumer's org/enterprise admin — see the README "Local-job
  #   packaging" section before adopting.
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to review (only needed for manual/comment-style invocations; PR events carry their own number)'
        required: false
        type: string
        default: ''
      model:
        description: 'Primary review model ID (optional). Same semantics as the workflow_dispatch input.'
        required: false
        type: string
        default: ''
      model_preset:
        description: 'Model preset (optional). Same accepted values as the workflow_dispatch dropdown; anything other than "(repository default)" pins provider + all three model tiers.'
        required: false
        type: string
        default: '(repository default)'
      runner:
        description: 'Runner label for the review job (e.g. self-hosted for private-network gateways).'
        required: false
        type: string
        default: 'ubuntu-latest'
      tools_ref:
        description: 'Ref of generic-automation-and-it/smooth-ai-report-review to fetch the review scripts from. Default: the same ref this reusable workflow was called at.'
        required: false
        type: string
        default: ''
      mandatory_context_files:
        description: 'Override for MANDATORY_CONTEXT_FILES (space-separated paths resolved in the repo under review). Blank → the built-in default list.'
        required: false
        type: string
        default: ''
      agents_md_exempt_paths:
        description: 'Override for AGENTS_MD_EXEMPT_PATHS (pipe-separated). Blank → the built-in default.'
        required: false
        type: string
        default: ''
      disable_claude_code:
        description: 'Disable Claude Code (.claude) support (1=disabled, 0=enabled). Blank → OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE / 1.'
        required: false
        type: string
        default: ''
      disable_agents_md_check:
        description: 'Disable AGENTS.md documentation validation (1=disabled, 0=enabled). Blank → OPENCODE_REVIEW_REPORT_DISABLE_AGENTS_MD_CHECK / 0.'
        required: false
        type: string
        default: ''
      bypass_mandatory_context_file:
        description: 'Bypass AGENTS.md checks and mandatory context file loading (1=bypassed, 0=normal). Blank → OPENCODE_REVIEW_REPORT_BYPASS_MANDATORY_CONTEXT_FILE / empty.'
        required: false
        type: string
        default: ''
      opencode_config:
        description: 'Repo-relative path to a custom opencode.json inside the repo under review (e.g. .github/opencode.json). Blank → OPENCODE_REVIEW_REPORT_CONFIG Variable, else the built-in .agents/skills/ai-review-report/assets/opencode.json. Any override MUST keep {env:OPENCODE_*} placeholders for credentials — never commit real keys.'
        required: false
        type: string
        default: ''
    # Provider API keys, declared so out-of-org callers can pass them EXPLICITLY.
    # `secrets: inherit` only works when caller and this workflow live in the same
    # organization/enterprise; a caller in a different org must map each key (see the
    # caller template). All are `required: false` — only the selected provider's key
    # is read at runtime; the unused ones resolve empty and are never routed to. The
    # job-level env: block reads these via secrets.* regardless of how they were passed.
    secrets:
      OPENCODE_GEMINI_API_KEY:
        required: false
      OPENCODE_COPILOT_API_KEY:
        required: false
      OPENCODE_OPENAI_API_KEY:
        required: false
      OPENCODE_ANTHROPIC_API_KEY:
        required: false
      OPENCODE_GO_OPENAI_API_KEY:
        required: false
      OPENCODE_GO_ANTHROPIC_API_KEY:
        required: false
      OPENCODE_OPENROUTER_API_KEY:
        required: false
permissions:
  pull-requests: write
  contents: read
  issues: write

concurrency:
  # Selective concurrency: Only apply shared group to pull_request events
  # - pull_request events: Use shared group (ai-review-{pr_number}) so multiple
  #   synchronize events cancel each other (only latest commit matters)
  # - issue_comment, workflow_dispatch: Use unique group per run
  #   so manual /ai-review commands don't cancel in-progress automated reviews
  # This ensures reviews always complete and aren't cancelled unexpectedly
  group: ${{ github.event_name == 'pull_request' && format('ai-review-{0}', github.event.pull_request.number) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

env:
  # Force GHA runner to use Node24 (official opt-in flag, runner PR #3948).
  # This opts into Node24 early to ensure deterministic behavior across
  # runner updates and surface incompatibilities before the hard migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  open-code-review-report:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '/ai-review') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (github.event_name == 'workflow_dispatch')
      )

    env:
      # Provider selector, default GEMINI. Allowed:
      #   GEMINI | COPILOT | OPENAI | ANTHROPIC | OPENCODE-GO-OPENAI | OPENCODE-GO-ANTHROPIC | OPEN_ROUTER
      # OpenCode Go is split in two because its Zen gateway serves two SDK surfaces:
      # OpenAI-compatible (deepseek/kimi) and Anthropic-compatible (qwen/minimax) —
      # one opencode.json provider block can pin only one npm. OPEN_ROUTER routes to
      # the OpenRouter aggregator (fixed public base, no URL var — LADR-039). ANTHROPIC
      # routes directly to Anthropic's API (fixed public base, no URL var — LADR-040).
      # Set the repo/org Variable OPENCODE_REVIEW_REPORT_PROVIDER to switch which provider
      # the review routes to. lib/resolve-provider.sh maps this to the gateway
      # credentials + provider-id and fails fast on a mismatched model chain.
      # The workflow_dispatch "model_preset" input (when not the default) wins over
      # the Variable: each preset pins the provider its model belongs to.
      OPENCODE_REVIEW_REPORT_PROVIDER: >-
        ${{
        (inputs.model_preset == 'Anthropic Claude Opus 4.8' && 'ANTHROPIC') ||
        (inputs.model_preset == 'Anthropic Claude Sonnet 4.6' && 'ANTHROPIC') ||
        (inputs.model_preset == 'Anthropic Claude Haiku 4.5' && 'ANTHROPIC') ||
        (inputs.model_preset == 'OpenAI GPT-5.5' && 'OPENAI') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Pro' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Flash' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode GLM-5.2' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode GLM-5.1' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode Grok 4.5' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode Hy3' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode Kimi K3' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode Kimi K2.7 Code' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode Kimi K2.6' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5 Pro' && 'OPENCODE-GO-OPENAI') ||
        (inputs.model_preset == 'OpenCode MiniMax M3' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.7' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.5' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Max' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Plus' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenCode Qwen3.6 Plus' && 'OPENCODE-GO-ANTHROPIC') ||
        (inputs.model_preset == 'OpenRouter DeepSeek V4 Pro' && 'OPEN_ROUTER') ||
        (inputs.model_preset == 'OpenRouter Qwen3.7 Plus' && 'OPEN_ROUTER') ||
        (inputs.model_preset == 'OpenRouter GLM-5.1' && 'OPEN_ROUTER') ||
        (inputs.model_preset == 'OpenRouter MiniMax M3' && 'OPEN_ROUTER') ||
        vars.OPENCODE_REVIEW_REPORT_PROVIDER || 'GEMINI' }}
      OPENCODE_REVIEW_REPORT_PROVIDER_ID: >-
        ${{
        ((inputs.model_preset == 'Anthropic Claude Opus 4.8' || inputs.model_preset == 'Anthropic Claude Sonnet 4.6' || inputs.model_preset == 'Anthropic Claude Haiku 4.5') && 'anthropic') ||
        (inputs.model_preset == 'OpenAI GPT-5.5' && 'openai') ||
        ((inputs.model_preset == 'OpenCode DeepSeek V4 Pro' || inputs.model_preset == 'OpenCode DeepSeek V4 Flash' || inputs.model_preset == 'OpenCode GLM-5.2' || inputs.model_preset == 'OpenCode GLM-5.1' || inputs.model_preset == 'OpenCode Grok 4.5' || inputs.model_preset == 'OpenCode Hy3' || inputs.model_preset == 'OpenCode Kimi K3' || inputs.model_preset == 'OpenCode Kimi K2.7 Code' || inputs.model_preset == 'OpenCode Kimi K2.6' || inputs.model_preset == 'OpenCode MiMo V2.5' || inputs.model_preset == 'OpenCode MiMo V2.5 Pro') && 'go-openai') ||
        ((inputs.model_preset == 'OpenCode MiniMax M3' || inputs.model_preset == 'OpenCode MiniMax M2.7' || inputs.model_preset == 'OpenCode MiniMax M2.5' || inputs.model_preset == 'OpenCode Qwen3.7 Max' || inputs.model_preset == 'OpenCode Qwen3.7 Plus' || inputs.model_preset == 'OpenCode Qwen3.6 Plus') && 'go-anthropic') ||
        ((inputs.model_preset == 'OpenRouter DeepSeek V4 Pro' || inputs.model_preset == 'OpenRouter Qwen3.7 Plus' || inputs.model_preset == 'OpenRouter GLM-5.1' || inputs.model_preset == 'OpenRouter MiniMax M3') && 'openrouter') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'COPILOT' && 'github-copilot') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'OPENAI' && 'openai') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'ANTHROPIC' && 'anthropic') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'OPENCODE-GO-OPENAI' && 'go-openai') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'OPENCODE-GO-ANTHROPIC' && 'go-anthropic') ||
        (vars.OPENCODE_REVIEW_REPORT_PROVIDER == 'OPEN_ROUTER' && 'openrouter') ||
        'gemini' }}
      # All seven providers' credentials are exported at job scope so opencode's
      # {env:OPENCODE_<P>_*} substitution in ~/.config/opencode/opencode.json
      # resolves for whichever provider is selected. Unused pairs resolve empty and
      # are simply never routed to.
      OPENCODE_GEMINI_API_KEY: ${{ secrets.OPENCODE_GEMINI_API_KEY }}
      OPENCODE_REVIEW_REPORT_GEMINI_URL: ${{ vars.OPENCODE_REVIEW_REPORT_GEMINI_URL }}
      OPENCODE_COPILOT_API_KEY: ${{ secrets.OPENCODE_COPILOT_API_KEY }}
      OPENCODE_REVIEW_REPORT_COPILOT_URL: ${{ vars.OPENCODE_REVIEW_REPORT_COPILOT_URL }}
      OPENCODE_OPENAI_API_KEY: ${{ secrets.OPENCODE_OPENAI_API_KEY }}
      OPENCODE_REVIEW_REPORT_OPENAI_URL: ${{ vars.OPENCODE_REVIEW_REPORT_OPENAI_URL }}
      OPENCODE_ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_ANTHROPIC_API_KEY }}
      OPENCODE_GO_OPENAI_API_KEY: ${{ secrets.OPENCODE_GO_OPENAI_API_KEY }}
      OPENCODE_GO_ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_GO_ANTHROPIC_API_KEY }}
      OPENCODE_OPENROUTER_API_KEY: ${{ secrets.OPENCODE_OPENROUTER_API_KEY }}
      # Models sourced from repo/org GitHub Variables so they can be retuned
      # without editing this workflow; each falls back to a literal default if the
      # Variable is unset.
      OPENCODE_REVIEW_REPORT_MODEL_PRIMARY: >-
        ${{
        (inputs.model_preset == 'Anthropic Claude Opus 4.8' && 'claude-opus-4-8') ||
        (inputs.model_preset == 'Anthropic Claude Sonnet 4.6' && 'claude-sonnet-4-6') ||
        (inputs.model_preset == 'Anthropic Claude Haiku 4.5' && 'claude-haiku-4-5') ||
        (inputs.model_preset == 'OpenAI GPT-5.5' && 'gpt-5.5') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Pro' && 'deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Flash' && 'deepseek-v4-flash') ||
        (inputs.model_preset == 'OpenCode GLM-5.2' && 'glm-5.2') ||
        (inputs.model_preset == 'OpenCode GLM-5.1' && 'glm-5.1') ||
        (inputs.model_preset == 'OpenCode Grok 4.5' && 'grok-4.5') ||
        (inputs.model_preset == 'OpenCode Hy3' && 'hy3') ||
        (inputs.model_preset == 'OpenCode Kimi K3' && 'kimi-k3') ||
        (inputs.model_preset == 'OpenCode Kimi K2.7 Code' && 'kimi-k2.7-code') ||
        (inputs.model_preset == 'OpenCode Kimi K2.6' && 'kimi-k2.6') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5' && 'mimo-v2.5') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5 Pro' && 'mimo-v2.5-pro') ||
        (inputs.model_preset == 'OpenCode MiniMax M3' && 'minimax-m3') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.7' && 'minimax-m2.7') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.5' && 'minimax-m2.5') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Max' && 'qwen3.7-max') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Plus' && 'qwen3.7-plus') ||
        (inputs.model_preset == 'OpenCode Qwen3.6 Plus' && 'qwen3.6-plus') ||
        (inputs.model_preset == 'OpenRouter DeepSeek V4 Pro' && 'deepseek/deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenRouter Qwen3.7 Plus' && 'qwen/qwen3.7-plus') ||
        (inputs.model_preset == 'OpenRouter GLM-5.1' && 'z-ai/glm-5.1') ||
        (inputs.model_preset == 'OpenRouter MiniMax M3' && 'minimax/minimax-m3') ||
        inputs.model || vars.OPENCODE_REVIEW_REPORT_MODEL_PRIMARY || 'gemini-3.1-pro-preview' }}
      OPENCODE_REVIEW_REPORT_MODEL_SECONDARY: >-
        ${{
        (inputs.model_preset == 'Anthropic Claude Opus 4.8' && 'claude-opus-4-8') ||
        (inputs.model_preset == 'Anthropic Claude Sonnet 4.6' && 'claude-sonnet-4-6') ||
        (inputs.model_preset == 'Anthropic Claude Haiku 4.5' && 'claude-haiku-4-5') ||
        (inputs.model_preset == 'OpenAI GPT-5.5' && 'gpt-5.5') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Pro' && 'deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Flash' && 'deepseek-v4-flash') ||
        (inputs.model_preset == 'OpenCode GLM-5.2' && 'glm-5.2') ||
        (inputs.model_preset == 'OpenCode GLM-5.1' && 'glm-5.1') ||
        (inputs.model_preset == 'OpenCode Grok 4.5' && 'grok-4.5') ||
        (inputs.model_preset == 'OpenCode Hy3' && 'hy3') ||
        (inputs.model_preset == 'OpenCode Kimi K3' && 'kimi-k3') ||
        (inputs.model_preset == 'OpenCode Kimi K2.7 Code' && 'kimi-k2.7-code') ||
        (inputs.model_preset == 'OpenCode Kimi K2.6' && 'kimi-k2.6') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5' && 'mimo-v2.5') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5 Pro' && 'mimo-v2.5-pro') ||
        (inputs.model_preset == 'OpenCode MiniMax M3' && 'minimax-m3') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.7' && 'minimax-m2.7') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.5' && 'minimax-m2.5') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Max' && 'qwen3.7-max') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Plus' && 'qwen3.7-plus') ||
        (inputs.model_preset == 'OpenCode Qwen3.6 Plus' && 'qwen3.6-plus') ||
        (inputs.model_preset == 'OpenRouter DeepSeek V4 Pro' && 'deepseek/deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenRouter Qwen3.7 Plus' && 'qwen/qwen3.7-plus') ||
        (inputs.model_preset == 'OpenRouter GLM-5.1' && 'z-ai/glm-5.1') ||
        (inputs.model_preset == 'OpenRouter MiniMax M3' && 'minimax/minimax-m3') ||
        vars.OPENCODE_REVIEW_REPORT_MODEL_SECONDARY || 'gemini-2.5-pro' }}
      OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR: >-
        ${{
        (inputs.model_preset == 'Anthropic Claude Opus 4.8' && 'claude-opus-4-8') ||
        (inputs.model_preset == 'Anthropic Claude Sonnet 4.6' && 'claude-sonnet-4-6') ||
        (inputs.model_preset == 'Anthropic Claude Haiku 4.5' && 'claude-haiku-4-5') ||
        (inputs.model_preset == 'OpenAI GPT-5.5' && 'gpt-5.5') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Pro' && 'deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenCode DeepSeek V4 Flash' && 'deepseek-v4-flash') ||
        (inputs.model_preset == 'OpenCode GLM-5.2' && 'glm-5.2') ||
        (inputs.model_preset == 'OpenCode GLM-5.1' && 'glm-5.1') ||
        (inputs.model_preset == 'OpenCode Grok 4.5' && 'grok-4.5') ||
        (inputs.model_preset == 'OpenCode Hy3' && 'hy3') ||
        (inputs.model_preset == 'OpenCode Kimi K3' && 'kimi-k3') ||
        (inputs.model_preset == 'OpenCode Kimi K2.7 Code' && 'kimi-k2.7-code') ||
        (inputs.model_preset == 'OpenCode Kimi K2.6' && 'kimi-k2.6') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5' && 'mimo-v2.5') ||
        (inputs.model_preset == 'OpenCode MiMo V2.5 Pro' && 'mimo-v2.5-pro') ||
        (inputs.model_preset == 'OpenCode MiniMax M3' && 'minimax-m3') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.7' && 'minimax-m2.7') ||
        (inputs.model_preset == 'OpenCode MiniMax M2.5' && 'minimax-m2.5') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Max' && 'qwen3.7-max') ||
        (inputs.model_preset == 'OpenCode Qwen3.7 Plus' && 'qwen3.7-plus') ||
        (inputs.model_preset == 'OpenCode Qwen3.6 Plus' && 'qwen3.6-plus') ||
        (inputs.model_preset == 'OpenRouter DeepSeek V4 Pro' && 'deepseek/deepseek-v4-pro') ||
        (inputs.model_preset == 'OpenRouter Qwen3.7 Plus' && 'qwen/qwen3.7-plus') ||
        (inputs.model_preset == 'OpenRouter GLM-5.1' && 'z-ai/glm-5.1') ||
        (inputs.model_preset == 'OpenRouter MiniMax M3' && 'minimax/minimax-m3') ||
        vars.OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR || 'gemini-3-flash-preview' }}
      # Optional custom opencode.json source. Precedence: opencode_config input
      # → OPENCODE_REVIEW_REPORT_CONFIG Variable → built-in.
      OPENCODE_REVIEW_REPORT_CONFIG: ${{ inputs.opencode_config || vars.OPENCODE_REVIEW_REPORT_CONFIG || '' }}
      OPENCODE_REVIEW_REPORT_CLI_VERSION: ${{ vars.OPENCODE_REVIEW_REPORT_CLI_VERSION || '' }}
      OPENCODE_REVIEW_REPORT_MAX_FILE_COUNT: ${{ vars.OPENCODE_REVIEW_REPORT_MAX_FILE_COUNT || '100' }}
      # Code graph analysis (LADR-049) — opt-in Tree-sitter-based knowledge graph.
      # When enabled, builds a SQLite graph of the repo and runs detect-changes
      # to produce risk-scored function-level analysis. The graph data enriches
      # chunk prompts and aggregation (see LADR-050/051/052 for downstream consumers).
      # GRAPH_VERSION pins the code-review-graph package version for supply-chain
      # hygiene (mirrors OPENCODE_REVIEW_REPORT_CLI_VERSION for opencode).
      OPENCODE_REVIEW_REPORT_ENABLE_GRAPH_ANALYSIS: ${{ vars.OPENCODE_REVIEW_REPORT_ENABLE_GRAPH_ANALYSIS || '1' }}
      OPENCODE_REVIEW_REPORT_GRAPH_VERSION: ${{ vars.OPENCODE_REVIEW_REPORT_GRAPH_VERSION || '' }}
      MANDATORY_CONTEXT_FILES: >-
        ${{ inputs.mandatory_context_files ||
        'AGENTS.md
        .docs/nfr/PROJECT_SETUP_AGENTS.md
        .agents/skills/code-review-standards/SKILL.md
        .docs/nfr/TOOL_SETUP_AGENTS.md
        .agents/rules-scoped/backend/testing-standards.instructions.md
        .agents/rules-scoped/backend/dotnet-standards.instructions.md' }}
      AGENTS_MD_EXEMPT_PATHS: >-
        ${{ inputs.agents_md_exempt_paths || '.docs/release-notes' }}
      OPENCODE_REVIEW_REPORT_DISABLE_AGENTS_MD_CHECK: ${{ inputs.disable_agents_md_check || vars.OPENCODE_REVIEW_REPORT_DISABLE_AGENTS_MD_CHECK || '0' }}
      OPENCODE_REVIEW_REPORT_BYPASS_MANDATORY_CONTEXT_FILE: ${{ inputs.bypass_mandatory_context_file || vars.OPENCODE_REVIEW_REPORT_BYPASS_MANDATORY_CONTEXT_FILE || '' }}
      OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE: ${{ inputs.disable_claude_code || vars.OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE || '1' }}
      OPENCODE_DISABLE_CLAUDE_CODE: ${{ inputs.disable_claude_code || vars.OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE || '1' }}

    steps:
      - name: Checkout PR head (or default branch for non-PR events; script re-fetches)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # `pull_request` events: head.ref resolves the PR head.
          # `issue_comment` / `workflow_dispatch`: `github.event.pull_request` is absent,
          # so the expression falls through to `github.ref` (typically the default
          # branch). The script's re-fetch step (the "Re-checking out PR"
          # block guarded by `EVENT_NAME != "pull_request"`) re-fetches the
          # actual PR head from `${head_repo}@${head_ref}` (resolved via the
          # GitHub API from the event payload), so end-to-end correctness
          # does NOT depend on this checkout being right for non-PR events.
          # Previously this expression fell through to
          # `steps.pr_details.outputs.head_ref` for non-`pull_request` events
          # (a real value from the now-removed `pr_details` step in the
          # pre-refactor workflow). The wrapper refactor removed the
          # `pr_details` step, so the `||` clause was dead code; the
          # simpler `github.ref` fallback matches the local-job caller's
          # shape.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.repository }}

      # ── Review-script resolution ─────────────────────────────────────────────
      # The job body is a thin wrapper around scripts/run-review.sh — the same
      # entrypoint invoked by the local-job packaging in
      # .docs/examples/code-review-local.yml. NOTE: this wrapper does NOT set
      # or read $REVIEW_SKILL_DIR — the "Run review gate" step below dispatches
      # directly via `[ -f ... ]` against the two paths checked out here.
      # $REVIEW_SKILL_DIR is the script's own contract (see run-review.sh's
      # resolve_skill_dir), used by callers like the local-job packaging that
      # invoke run-review.sh from outside this two-path checkout shape. Two
      # sources for the skill tree:
      # 1. Copy-installed / in-repo mode: the checked-out repo carries the skill at
      #    .agents/skills/ai-review-report (the README installer rewrites that
      #    literal when it targets a different skills dir — keep it literal here).
      # 2. Reusable-workflow mode: the caller repo has no skill installed, so fetch
      #    the tooling repo as a side checkout, version-locked to the same ref this
      #    workflow was called at (github.workflow_sha — the SHA of the workflow file
      #    that defines this job), overridable via the tools_ref input.
      - name: Fetch review tooling
        if: "!hashFiles('.agents/skills/ai-review-report/scripts/review-in-chunks.sh')"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: generic-automation-and-it/smooth-ai-report-review
          ref: ${{ vars.SMOOTH_AI_REVIEW_TOOLS_REF || inputs.tools_ref || github.workflow_sha || 'v1' }}
          path: .smooth-ai-review-tools

      # ── Code graph analysis (LADR-049) ──────────────────────────────────────
      # Opt-in: enabled by setting OPENCODE_REVIEW_REPORT_ENABLE_GRAPH_ANALYSIS
      # to a truthy value (1/true/yes/on, case-insensitive) as a repo/org Variable.
      # When enabled, the review gate builds a Tree-sitter knowledge graph of the
      # repo and uses it for risk-scored function-level analysis. The graph DB is
      # cached between runs for fast incremental updates. The actual install + build
      # logic lives in scripts/lib/build-code-graph.sh (called from run-review.sh
      # Step 13.5) — this cache step just persists the .code-review-graph/ directory
      # between CI runs. The if: condition uses contains() to match the wider truthy
      # set accepted by run-review.sh (1|true|yes|on). Note: GitHub Actions doesn't
      # have toLower(), so the variable value should be lowercase.
      - name: Cache code knowledge graph
        if: contains('1 true yes on', vars.OPENCODE_REVIEW_REPORT_ENABLE_GRAPH_ANALYSIS || '1')
        uses: actions/cache@v4
        with:
          path: .code-review-graph
          # Key on source-tree hashes so the graph invalidates when code changes
          # (the common case), not just when dependencies change. Includes lockfile
          # hashes as a secondary signal for dep-only changes. Schema version suffix
          # allows force-invalidation on graph format changes.
          key: crg-${{ runner.os }}-${{ hashFiles('**/*.cs', '**/*.csproj', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.py', '**/*.go', '**/*.java', '**/go.mod', '**/go.sum', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/requirements*.txt', '**/Pipfile.lock', '**/poetry.lock') }}-v1
          restore-keys: |
            crg-${{ runner.os }}-

      - name: Run review gate
        env:
          # run-review.sh posts reviews via `gh pr review` / `gh pr comment` /
          # `gh api`, all of which require GITHUB_TOKEN. The runner only
          # auto-injects GITHUB_TOKEN into step env when the step declares
          # it explicitly; bare `run:` shells see the bare runner env which
          # does NOT include it. Forward secrets.GITHUB_TOKEN here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Forward the workflow's dispatch input for issue_comment and
          # workflow_dispatch. run-review.sh reads it via $REVIEWER_INPUT
          # (env-var contract — NOT inputs.* / steps.*.outputs).
          REVIEWER_INPUT: ${{ inputs.pr_number }}
        run: |
          set -e
          if [ -f ".agents/skills/ai-review-report/scripts/review-in-chunks.sh" ]; then
            bash .agents/skills/ai-review-report/scripts/run-review.sh
          else
            bash .smooth-ai-review-tools/.agents/skills/ai-review-report/scripts/run-review.sh
          fi

      - name: Post Error Comment
        if: failure()
        env:
          LOGS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # The failure path: ci_temp may not exist or may not contain pr_info
          # (e.g. a hard fail before PR metadata was resolved). Read the PR
          # number from the GitHub event payload (pull_request.number for
          # pull_request events, issue.number for issue_comment).
          PR_NUMBER=""
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            PR_NUMBER="$(jq -r 'if .pull_request then .pull_request.number elif .issue then .issue.number elif .inputs then .inputs.pr_number else "" end' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")"
          fi
          if [ -n "$PR_NUMBER" ]; then
            # ci_temp may not exist (the failure path can fire before any
            # earlier step created it). mkdir BEFORE the heredoc open()
            # so the cat doesn't fail first under `set -e` and abort
            # before the comment can post.
            mkdir -p ci_temp
            cat > ci_temp/error_comment.md <<EOF
          ## ❌ OpenCode CLI Code Review Workflow Failed

          The automated code review workflow encountered a critical failure and could not complete.

          **Next Steps:**
          - Check the [workflow logs](${LOGS_URL}) for detailed error information
          - You can manually trigger a review by commenting \`/ai-review\` on this PR
          - Consider reviewing the changes manually if the issue persists

          ---
          *This PR is blocked until the review issue is resolved or manual review is completed.*
          EOF
            gh pr comment "${PR_NUMBER}" --body-file ci_temp/error_comment.md || true
          fi

      - name: Clean up temporary files
        if: always()
        run: |
          set -e
          rm -rf ci_temp

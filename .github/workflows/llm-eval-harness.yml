# LLM Eval Harness for the chunk-review model.
#
# Scores the chunk-review LLM (the gate's blocking-findings call) against a
# labeled corpus on two axes — precision (must-NOT-flag / the DR golden set) and
# recall (must-catch / seeded real defects) — so prompt/model/LADR changes can be
# regression-tested. See LADR-033 in .agents/skills/ai-review-report/SKILL.md.
#
# *** MAKES REAL, PAID MODEL CALLS. Triggers: manual (workflow_dispatch), a
#     POST-MERGE CANARY on push to main, and — since it became a required PR
#     status check — pull_request on a NON-DRAFT PR (opened / reopened /
#     ready_for_review / pushes to an already-ready PR).
#
#     The PR trigger deliberately carries NO `paths:` filter, and that is not an
#     oversight. A workflow skipped by a path filter never reports a check run at
#     all, so a required check would sit "Expected — waiting for status" forever
#     on every PR that misses the filter, and the PR could never merge. The
#     relevance test therefore moved INSIDE the job ("Scope check" below): the
#     job always runs and always reports, but the paid model calls only happen
#     when the PR actually touches the review pipeline. A doc-only PR costs one
#     checkout and a `git diff --name-only`.
#
#     Two classes of PR skip the job entirely (a skipped job reports as success
#     to branch protection, so neither can wedge a PR):
#       - DRAFT PRs — the eval is a merge gate, not a work-in-progress signal.
#       - FORK PRs — `pull_request` from a fork gets no secrets, so every provider
#         key would be empty and the run would fail on the health probe. A
#         permanently-red check on contributor PRs is worse than no check; those
#         run post-merge on the canary instead. ***
#
# Workflow↔script path coupling (repo Non-Negotiable): this file invokes the
# harness by hardcoded path (.agents/skills/ai-review-report/scripts/eval/...).
# Moving/renaming the harness scripts requires editing this file in the same commit.
name: LLM Eval Harness

on:
  # Post-merge canary: run after a change lands on main, but ONLY when it touches
  # the review pipeline (the prompt-assembly + transport + corpus the eval scores,
  # or this workflow). Cannot block a merge —
  # a regression surfaces as a failed run on main. Arbitrary product/doc PRs that
  # do not touch these paths never trigger a paid run.
  push:
    branches: [main]
    paths:
      - ".agents/skills/ai-review-report/**"
      - ".github/workflows/llm-eval-harness.yml"
  # PR gate. `synchronize` covers "a push to a PR that is already ready for
  # review"; `ready_for_review` covers the draft→ready transition, which is the
  # first point at which the eval is meant to have an opinion. No `paths:` here —
  # see the header: a path-skipped workflow reports no check at all, which would
  # block a required check permanently. Relevance is decided in the job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider: GEMINI | COPILOT | OPENAI | ANTHROPIC | OPENCODE-GO-OPENAI | OPENCODE-GO-ANTHROPIC | OPEN_ROUTER (blank = repo Variable / GEMINI)"
        required: false
        type: string
      model:
        description: "Chunk-review model under eval (blank = Variable / default)"
        required: false
        type: string
      recall_threshold:
        description: "Min must-catch catch-rate %% to pass"
        required: false
        type: string
        default: "80"
      samples:
        description: "Runs per fixture (1 = single-shot; >1 = precision worst-case, recall majority)"
        required: false
        type: string
        default: "1"
      filter:
        description: "Only run fixtures whose id contains this substring (blank = all)"
        required: false
        type: string
      parallel:
        description: "Fixtures evaluated concurrently (blank = EVAL_PARALLEL Variable, else 4). Each one is a live model call — raising this trades wall-clock for provider rate-limit risk, and a rate-limited fixture fails the run as an INFRA failure."
        required: false
        type: string

permissions:
  contents: read

# One in-flight eval per PR (or per branch/dispatch). A 20-minute paid run whose
# commit has already been superseded by the next push is money spent on a status
# nobody will read. Never cancels the post-merge canary on main — that group key
# is the ref, and main pushes are serialised anyway.
concurrency:
  group: llm-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  llm-evals:
    # Network-bound (chunked <100KB/call); the selected provider endpoint must be
    # publicly reachable from GitHub-hosted runners (repo Non-Negotiable). Switch
    # to self-hosted only if a private-network endpoint is ever used.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Draft and fork PRs skip the whole job. A job skipped by `if:` still
    # reports its check as skipped, which branch protection counts as passing —
    # unlike a workflow that never triggers, which blocks forever. Non-PR events
    # (push canary, dispatch) are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)

    env:
      # Provider selector — dispatch input wins, else repo Variable, else GEMINI.
      # Same OPENCODE_REVIEW_REPORT_* Variables/Secrets the review gate uses, so the
      # eval exercises the DESIGNED models (not a hardcoded chain).
      OPENCODE_REVIEW_REPORT_PROVIDER: ${{ github.event.inputs.provider || vars.OPENCODE_REVIEW_REPORT_PROVIDER || 'GEMINI' }}
      # All provider credential pairs at job scope so opencode.json's
      # {env:OPENCODE_*} substitution resolves for whichever provider is selected.
      # API keys = Secrets (un-prefixed); gateway URLs = OPENCODE_REVIEW_REPORT_*
      # Variables (retunable). The two OpenCode Go surfaces, OpenRouter, and the
      # direct Anthropic provider have no URL var (fixed public base).
      OPENCODE_GEMINI_API_KEY: ${{ secrets.OPENCODE_GEMINI_API_KEY }}
      OPENCODE_REVIEW_REPORT_GEMINI_URL: ${{ vars.OPENCODE_REVIEW_REPORT_GEMINI_URL }}
      OPENCODE_COPILOT_API_KEY: ${{ secrets.OPENCODE_COPILOT_API_KEY }}
      OPENCODE_REVIEW_REPORT_COPILOT_URL: ${{ vars.OPENCODE_REVIEW_REPORT_COPILOT_URL }}
      OPENCODE_OPENAI_API_KEY: ${{ secrets.OPENCODE_OPENAI_API_KEY }}
      OPENCODE_REVIEW_REPORT_OPENAI_URL: ${{ vars.OPENCODE_REVIEW_REPORT_OPENAI_URL }}
      OPENCODE_ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_ANTHROPIC_API_KEY }}
      OPENCODE_GO_OPENAI_API_KEY: ${{ secrets.OPENCODE_GO_OPENAI_API_KEY }}
      OPENCODE_GO_ANTHROPIC_API_KEY: ${{ secrets.OPENCODE_GO_ANTHROPIC_API_KEY }}
      OPENCODE_OPENROUTER_API_KEY: ${{ secrets.OPENCODE_OPENROUTER_API_KEY }}
      # Model chain — dispatch input overrides PRIMARY. SECONDARY/ORCHESTRATOR are
      # optional; run-evals.sh defaults blanks to PRIMARY so non-GEMINI dispatches
      # do not inherit Gemini literals from the review gate.
      OPENCODE_REVIEW_REPORT_MODEL_PRIMARY: ${{ github.event.inputs.model || vars.OPENCODE_REVIEW_REPORT_MODEL_PRIMARY || 'gemini-3.1-pro-preview' }}
      OPENCODE_REVIEW_REPORT_MODEL_SECONDARY: ${{ vars.OPENCODE_REVIEW_REPORT_MODEL_SECONDARY || '' }}
      OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR: ${{ vars.OPENCODE_REVIEW_REPORT_MODEL_ORCHESTRATOR || '' }}
      OPENCODE_CLI_VERSION: ${{ vars.OPENCODE_CLI_VERSION || '' }}
      # Disable Claude Code (.claude) support to avoid conflicts with opencode.
      OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE: ${{ vars.OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE || '1' }}
      OPENCODE_DISABLE_CLAUDE_CODE: ${{ vars.OPENCODE_REVIEW_REPORT_DISABLE_CLAUDE_CODE || '1' }}
      # Eval config (from dispatch inputs; run-evals.sh has its own defaults).
      EVAL_RECALL_THRESHOLD: ${{ github.event.inputs.recall_threshold || '80' }}
      EVAL_SAMPLES: ${{ github.event.inputs.samples || '1' }}
      EVAL_FILTER: ${{ github.event.inputs.filter || '' }}
      # Fixtures in flight. The corpus is ~20 live model calls at ~35s-3min each,
      # so serial is ~25 minutes of wall clock on a required PR check. 4 is the
      # conservative default: it is the concurrency the endpoint has not been
      # observed to rate-limit, and a rate-limited fixture fails the run outright
      # (INFRA), so over-tuning this buys speed with flakiness. Raise via the
      # EVAL_PARALLEL Variable once a real run shows headroom.
      EVAL_PARALLEL: ${{ github.event.inputs.parallel || vars.EVAL_PARALLEL || '4' }}
      # Triage archive: run-evals.sh copies each fixture's review markdown here so
      # a precision FAIL is inspectable (the per-fixture sandbox is wiped on exit).
      # Uploaded by the post-run step below (if: always(), since a regression exits 1).
      EVAL_ARTIFACT_DIR: ${{ github.workspace }}/ci_temp/eval-artifacts

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The scope check below diffs against the PR base, so the base commit
          # has to be present. Unconditional 0 — do NOT write this as
          # `${{ github.event_name == 'pull_request' && 0 || 1 }}`: GitHub
          # expressions treat 0 as falsy, so the `&& 0 ||` arm collapses to 1 and
          # the PR path silently gets a shallow clone whose base commit is
          # missing. The scope check would then fail its diff and fall back to
          # "relevant", paying for a full eval on every PR.
          fetch-depth: 0

      - name: Scope check
        id: scope
        # The `paths:` filter this replaces for the PR trigger. Same path list as
        # the push canary above — keep the two in sync; they answer the same
        # question ("could this change move the eval result?") for the two events.
        #
        # The eval scores the reviewer against a FIXED corpus, so an arbitrary
        # PR's product code cannot change the outcome — only the prompt-assembly,
        # transport, corpus, or this workflow can. Everything else is a guaranteed
        # no-op that would still cost ~20 minutes of paid model calls.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push canary + dispatch: the trigger already decided relevance.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three-dot: files this PR changed relative to the merge base, not
          # files that landed on the base branch meanwhile.
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null || true)"
          if [ -z "$changed" ]; then
            # A diff we could not compute must not silently skip the gate.
            echo "⚠️  Could not determine changed files — running the eval (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(\.agents/skills/ai-review-report/|\.github/workflows/llm-eval-harness\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "✅ Review-pipeline files changed — running the eval."
            printf '%s\n' "$changed" | grep -E '^(\.agents/skills/ai-review-report/|\.github/workflows/llm-eval-harness\.yml$)' | sed 's/^/    /'
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  No review-pipeline files changed — skipping the paid eval run."
            echo "    The eval scores a fixed corpus; nothing in this PR can move the result."
          fi

      - name: Install opencode
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -e
          # Install opencode via the shared lib (LADR-048) so this workflow
          # honours OPENCODE_CLI_VERSION the same way the review
          # gate does.
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash .agents/skills/ai-review-report/scripts/lib/install-opencode.sh
          opencode stats >/dev/null 2>&1 || true   # warm the SQLite store

      - name: Run LLM evals
        if: steps.scope.outputs.relevant == 'true'
        # run-evals.sh sources lib/resolve-provider.sh (resolves provider-id +
        # creds, fails fast on a bad model chain), installs the managed
        # opencode.json (setup-opencode-config.sh), runs the provider-agnostic
        # health check (opencode-health.sh), then drives review-in-chunks.sh per
        # fixture and scores. Non-zero exit on a precision regression, recall
        # below threshold, or infra failure → the job fails (the regression gate).
        run: |
          set -e
          bash .agents/skills/ai-review-report/scripts/eval/run-evals.sh

      - name: Upload eval review artifacts
        # Always upload (the eval step exits non-zero on a precision/recall
        # regression) so the per-fixture review markdown — the only record of WHAT
        # the model flagged — survives for triage. No-op if the dir is empty.
        # `always()` alone would also fire on a scope-skipped run; the extra
        # condition keeps those runs from uploading an empty artifact.
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-eval-reviews
          path: ci_temp/eval-artifacts/
          if-no-files-found: ignore
          retention-days: 14

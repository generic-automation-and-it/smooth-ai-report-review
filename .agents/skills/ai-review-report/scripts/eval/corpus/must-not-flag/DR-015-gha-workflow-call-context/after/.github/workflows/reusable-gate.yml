# do NOT flag: this workflow is callable via workflow_call — the github context is the caller's, so the if: gate and github.event.pull_request.* references below are correct as-is (DR-015).
name: Reusable Review Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (required: a manual run has no github.event.pull_request to fall back on)'
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number (optional; defaults to github.event.pull_request.number when invoked from a PR-triggered caller)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  review:
    # Caller event names only — never 'workflow_call'. The github context is the
    # caller's, so a PR-triggered caller sees event_name=='pull_request' here and
    # a manual caller sees 'workflow_dispatch'. (DR-015)
    if: (github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          # github.event.pull_request.* is fully populated when the caller was
          # PR-triggered; the inputs.pr_number input is the documented fallback
          # for non-PR callers. (DR-015)
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            echo "number=${INPUT_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run review
        uses: ./scripts/reusable-review
        with:
          pr_number: ${{ steps.pr.outputs.number }}

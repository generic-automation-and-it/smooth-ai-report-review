# do NOT flag: this workflow is callable via workflow_call — the github context is the caller's, so
# event_name is never 'workflow_call' and github.event.pull_request.* is populated for a PR-triggered
# caller. The if: gate and the payload reference below are correct as written (DR-015).
name: Reusable Review Gate

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    # Caller event names only — never 'workflow_call'.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Report the PR under review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Reviewing PR ${PR_NUMBER}"
